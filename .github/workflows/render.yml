name: Render Video
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install system deps (ffmpeg, chromium)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg chromium-browser

      - name: Install npm deps
        run: npm install

      - name: Ensure Chromium for Remotion
        run: npx remotion browser ensure

      - name: Render video (Remotion)
        run: |
          npx remotion render src/index.ts StoryVideo out/reel.mp4 \
            --codec h264 --crf 20 --concurrency 2

      - name: Post-process (loudnorm + faststart)
        run: |
          ffmpeg -y -i out/reel.mp4 -c:v libx264 -preset veryfast -crf 24 -pix_fmt yuv420p -movflags +faststart tmp.mp4
          ffmpeg -y -i tmp.mp4 -c:v copy -af loudnorm=I=-16:TP=-1.5:LRA=11 -c:a aac -b:a 160k -movflags +faststart final.mp4

      - name: Verify output
        run: |
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate -of csv=p=0 final.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 final.mp4

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: final.mp4
          retention-days: 7
